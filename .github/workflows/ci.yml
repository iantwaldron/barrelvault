name: CI

on:
  push:
  pull_request:

# The job reads the code and nothing more. Codecov takes its own token.
permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # The checks take under a minute. A hung step stops here instead of at six hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to a commit, since a tag can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock
          # The locked setuptools builds the package, so nothing unhashed is fetched.
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: |
          coverage run -m pytest
          coverage combine
          coverage xml
          coverage report --fail-under=100
      # Runs even when the 100% check fails, so Codecov still sees the drop.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: iantwaldron/barrelvault
          files: ./backend/coverage.xml
