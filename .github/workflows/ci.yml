name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # The checks take under a minute. A hung step stops here instead of at six hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: |
          coverage run -m pytest
          coverage combine
          coverage xml
          coverage report --fail-under=100
      # Runs even when the 100% check fails, so Codecov still sees the drop.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: iantwaldron/barrelvault
          files: ./backend/coverage.xml
