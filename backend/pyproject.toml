[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "barrelvault"
version = "0.1.0"
description = "A task management system where a person and their agents collaborate."
requires-python = ">=3.12"
# requirements.txt holds the pins, so they are written once.
dynamic = ["dependencies"]

[project.scripts]
barrelvault = "barrelvault.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["barrelvault*"]

[tool.setuptools.package-data]
barrelvault = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["barrelvault"]
branch = true
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["barrelvault/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["barrelvault", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["barrelvault"]
# Alembic generates the revisions; review them, do not type-check them.
exclude = ["barrelvault/migrations/versions/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
